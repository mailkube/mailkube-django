[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "mailkube-django"
# Derived from the git tag at build time, never stored in the tree. See
# [tool.hatch.version] below and .rules/RELEASE.md.
dynamic = ["version"]
description = "Django email backend for mailkube."
authors = [{ name = "Mail Tactic Corporation" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12,<4.0"
keywords = ["mailkube", "django", "email", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    # Every series inside the declared `django>=5.2` range. The CI matrix pins the two ends
    # of it, which is what keeps this list from becoming a wish.
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Communications :: Email",
]
dependencies = [
    "django>=5.2",
    "mailkube>=1.5.0",
]

# django-anymail is an EXTRA, never a runtime dependency. The standalone backend must keep
# working with nothing but Django and the SDK. See .rules/DJANGO_INTEGRATION.md.
#
# The floor is 13.0 because that is the first django-anymail release that claims Django 5.2,
# which is this package's own Django floor. Earlier releases resolve and pass the suite (the
# narrow surface anymail_backend.py touches has been stable since 10.0), but a floor is a
# claim about a supported combination, and `django>=5.2` paired with an anymail that stops at
# 5.0 is a combination nobody supports. The `floor` CI job installs exactly this pin.
[project.optional-dependencies]
anymail = ["django-anymail>=13.0"]

[project.urls]
Homepage = "https://github.com/mailkube/mailkube-django"
Repository = "https://github.com/mailkube/mailkube-django"
Issues = "https://github.com/mailkube/mailkube-django/issues"

[dependency-groups]
# django-anymail is deliberately NOT here. It is an extra, so `uv sync` gives the
# zero-extra install (Anymail tests skip themselves) and `uv sync --extra anymail` gives the
# full one. Putting it in dev would make the zero-extra path untestable, which is exactly
# the promise that needs testing. CI runs both.
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    # django-stubs' mypy plugin does not yet load under mypy 2.x (it fails with
    # "Error constructing plugin instance of NewSemanalDjangoPlugin"). Lift this pin once
    # django-stubs ships mypy 2 support.
    "mypy>=1.10,<2",
    "ruff>=0.15.20",
    "django-stubs[compatible-mypy]>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mailkube_django"]

# An sdist is source, not a checkout. Without an explicit list hatchling ships the whole
# tree — tests, CI config, governance docs — to everyone who installs from source.
# The `build` CI job asserts the OUTCOME of this list, not the list itself.
[tool.hatch.build.targets.sdist]
include = ["src/mailkube_django", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]

# The version IS the git tag. hatch-vcs resolves `v1.5.0` to `1.5.0` at build time and
# writes it into the distribution metadata, which `mailkube_django._version`
# reads back. Nothing has to be committed for a release to carry its version.
[tool.hatch.version]
source = "vcs"

# Bakes the resolved version into the sdist, so building a wheel from an sdist (which
# `uv build` does) works with no .git directory present.
[tool.hatch.build.hooks.vcs]
version-file = "src/mailkube_django/_vcs_version.py"

# ── Lint & format ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F/I/UP/B: baseline. C901: complexity (KISS). D: docstrings (documentation).
# SIM/PL/RUF: simplification + refactor smells. ARG: unused args (ISP smell). TRY: exception hygiene.
select = ["E", "F", "I", "UP", "B", "C901", "D", "SIM", "PL", "RUF", "ARG", "TRY"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR2004", "ARG", "S101"]

# ── Type checking ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
# tests/settings.py is what the django-stubs plugin imports; without this on the path
# the plugin fails to construct at all.
files = ["src"]
mypy_path = "tests"
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "settings"

# django-anymail ships no type information, so its base classes are Any and strict mode's
# disallow_subclassing_any would reject the ESP backend. Scoped to the one module that
# subclasses them rather than relaxed globally.
[[tool.mypy.overrides]]
module = "mailkube_django.anymail_backend"
disallow_subclassing_any = false

# ── Tests & coverage (90% line + branch, enforced) ────────────────────────────
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "settings"
pythonpath = ["tests"]
testpaths = ["tests"]
addopts = "-ra --cov=mailkube_django --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=90"

[tool.coverage.run]
source = ["mailkube_django"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

# ── Release automation (Conventional Commits → SemVer → PyPI via OIDC) ─────────
[tool.semantic_release]
# No `version_toml` and no `version_variables` on purpose: there is no version literal
# anywhere in the tree to rewrite. The tag is the single source of truth, semantic-release
# only creates it, and hatch-vcs reads it back at build time. This is what lets the release
# write NOTHING to `main`. See .rules/RELEASE.md.
build_command = ""
commit_parser = "conventional"
major_on_zero = false
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "main"
